{% extends "base.html" %}
{% block title %}Create Account — {{ store_name }}{% endblock %}

{% block content %}
<section>
  <div class="container">
    <div class="auth-wrap">
      <div class="section-heading">
        <div class="eyebrow">Join Us</div>
        <h2>Create Your Account</h2>
      </div>
      <form action="{{ url_for('register') }}" method="POST">
        <div class="field">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" minlength="6" required>
        </div>
        <button type="submit" class="btn btn-gold btn-block">Create Account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
    </div>
  </div>
</section>
{% endblock %}
