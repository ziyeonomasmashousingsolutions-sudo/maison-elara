{% extends "admin/_admin_base.html" %}
{% block title %}Edit Product — {{ store_name }}{% endblock %}

{% block admin_content %}
<div class="section-heading" style="text-align:left; margin-bottom:32px;">
  <div class="eyebrow align-left">Admin</div>
  <h2>Edit Product</h2>
</div>

<form class="admin-form" action="{{ url_for('admin_edit_product', product_id=product.id) }}" method="POST" enctype="multipart/form-data">
  <div class="field">
    <label for="name">Product Name</label>
    <input type="text" id="name" name="name" value="{{ product.name }}" required>
  </div>
  <div class="field">
    <label for="description">Description</label>
    <textarea id="description" name="description" rows="4" required>{{ product.description }}</textarea>
  </div>
  <div class="form-grid">
    <div class="field">
      <label for="price">Price (USD)</label>
      <input type="number" step="0.01" id="price" name="price" value="{{ product.price }}" required>
    </div>
    <div class="field">
      <label for="stock">Stock Quantity</label>
      <input type="number" id="stock" name="stock" value="{{ product.stock }}" required>
    </div>
  </div>
  <div class="field">
    <label for="category">Category</label>
    <select id="category" name="category">
      <option value="Clothing" {{ 'selected' if product.category == 'Clothing' }}>Clothing</option>
      <option value="Jewellery" {{ 'selected' if product.category == 'Jewellery' }}>Jewellery</option>
      <option value="Accessories" {{ 'selected' if product.category == 'Accessories' }}>Accessories</option>
    </select>
  </div>
  <div class="field">
    <label for="sizes">Sizes (comma-separated)</label>
    <input type="text" id="sizes" name="sizes" value="{{ product.sizes }}">
  </div>
  <div class="field">
    <label for="colors">Colours (comma-separated)</label>
    <input type="text" id="colors" name="colors" value="{{ product.colors }}">
  </div>

  <div class="field">
    <img src="{{ product.image_url }}" alt="{{ product.name }}" style="width:90px;height:110px;object-fit:cover;margin-bottom:12px;">
    <label for="image_file">Replace Image (optional)</label>
    <input type="file" id="image_file" name="image_file" accept="image/*">
  </div>
  <div class="field">
    <label for="image_url">...or paste a new Image URL</label>
    <input type="url" id="image_url" name="image_url" placeholder="https://...">
  </div>

  <div class="checkbox-row">
    <label><input type="checkbox" name="is_featured" {{ 'checked' if product.is_featured }}> Featured</label>
    <label><input type="checkbox" name="is_new_arrival" {{ 'checked' if product.is_new_arrival }}> New Arrival</label>
    <label><input type="checkbox" name="is_best_seller" {{ 'checked' if product.is_best_seller }}> Best Seller</label>
  </div>

  <button type="submit" class="btn btn-gold btn-block">Save Changes</button>
</form>
{% endblock %}
