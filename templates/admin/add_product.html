{% extends "admin/_admin_base.html" %}
{% block title %}Add Product — {{ store_name }}{% endblock %}

{% block admin_content %}
<div class="section-heading" style="text-align:left; margin-bottom:32px;">
  <div class="eyebrow align-left">Admin</div>
  <h2>Add Product</h2>
</div>

<form class="admin-form" action="{{ url_for('admin_add_product') }}" method="POST" enctype="multipart/form-data">
  <div class="field">
    <label for="name">Product Name</label>
    <input type="text" id="name" name="name" required>
  </div>
  <div class="field">
    <label for="description">Description</label>
    <textarea id="description" name="description" rows="4" required></textarea>
  </div>
  <div class="form-grid">
    <div class="field">
      <label for="price">Price (USD)</label>
      <input type="number" step="0.01" id="price" name="price" required>
    </div>
    <div class="field">
      <label for="stock">Stock Quantity</label>
      <input type="number" id="stock" name="stock" value="0" required>
    </div>
  </div>
  <div class="field">
    <label for="category">Category</label>
    <select id="category" name="category">
      <option value="Clothing">Clothing</option>
      <option value="Jewellery">Jewellery</option>
      <option value="Accessories">Accessories</option>
    </select>
  </div>
  <div class="field">
    <label for="sizes">Sizes (comma-separated, leave blank if none)</label>
    <input type="text" id="sizes" name="sizes" placeholder="XS,S,M,L,XL">
  </div>
  <div class="field">
    <label for="colors">Colours (comma-separated)</label>
    <input type="text" id="colors" name="colors" placeholder="Black,Gold,Ivory">
  </div>

  <div class="field">
    <label for="image_file">Upload Image {% if not config.CLOUDINARY_CLOUD_NAME %}(saved locally — set up Cloudinary for hosted images){% else %}(uploaded to Cloudinary){% endif %}</label>
    <input type="file" id="image_file" name="image_file" accept="image/*">
  </div>
  <div class="field">
    <label for="image_url">...or paste an Image URL instead</label>
    <input type="url" id="image_url" name="image_url" placeholder="https://...">
  </div>

  <div class="checkbox-row">
    <label><input type="checkbox" name="is_featured"> Featured</label>
    <label><input type="checkbox" name="is_new_arrival"> New Arrival</label>
    <label><input type="checkbox" name="is_best_seller"> Best Seller</label>
  </div>

  <button type="submit" class="btn btn-gold btn-block">Add Product</button>
</form>
{% endblock %}
