{# Expects a `product` variable in context #}
<article class="product-card">
  <a href="{{ url_for('product_detail', product_id=product.id) }}">
    <div class="product-media">
      {% if product.is_new_arrival %}<span class="product-tag">New</span>
      {% elif product.is_best_seller %}<span class="product-tag">Best Seller</span>{% endif %}
      <img src="{{ product.image_url }}" alt="{{ product.name }}" loading="lazy">
      <span class="corner tl"></span>
      <span class="corner br"></span>
    </div>
  </a>
  <div class="product-category">{{ product.category }}</div>
  <a href="{{ url_for('product_detail', product_id=product.id) }}">
    <h3 class="product-name">{{ product.name }}</h3>
  </a>
  <div class="product-price">${{ '%.2f'|format(product.price) }}</div>
  <form action="{{ url_for('cart_add') }}" method="POST">
    <input type="hidden" name="product_id" value="{{ product.id }}">
    <input type="hidden" name="qty" value="1">
    <button type="submit" class="add-to-cart-btn" {{ 'disabled' if product.stock <= 0 }}>
      {{ 'Sold Out' if product.stock <= 0 else 'Add to Bag' }}
    </button>
  </form>
</article>
